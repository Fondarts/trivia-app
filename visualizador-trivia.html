<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Trivia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 5px;
            font-size: 1.3em;
        }

        .header p {
            font-size: 0.85em;
        }

        .file-input-container {
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
        }

        .image-path-input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            flex: 1;
        }

        .image-path-label {
            font-size: 0.85em;
            color: #6c757d;
            white-space: nowrap;
        }

        .export-button {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .export-button:hover {
            background: #c82333;
        }

        .export-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        input[type="file"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="file"]:hover {
            border-color: #667eea;
        }

        .questions-container {
            padding: 10px;
        }

        .question-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: all 0.2s;
        }

        .question-card.has-error {
            background: #fff5f5;
            border-color: #dc3545;
        }

        .error-checkbox-container {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding-right: 8px;
        }

        .error-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #dc3545;
        }

        .question-image {
            flex-shrink: 0;
            width: 120px;
            height: 90px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #ddd;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 10px;
        }

        .question-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        .question-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .question-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-text {
            font-size: 0.95em;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.4;
            flex: 1;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .difficulty-easy {
            background: #d4edda;
            color: #155724;
        }

        .difficulty-medium {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty-hard {
            background: #f8d7da;
            color: #721c24;
        }

        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .option {
            padding: 4px 10px;
            background: #f8f9fa;
            border-left: 3px solid #667eea;
            border-radius: 4px;
            font-size: 0.85em;
            flex: 1;
            min-width: calc(25% - 6px);
        }

        .option.correct {
            background: #d4edda;
            border-left-color: #28a745;
            font-weight: 600;
        }

        .option-number {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 0.75em;
            font-weight: 600;
            margin-right: 6px;
        }

        .option.correct .option-number {
            background: #28a745;
        }

        .no-questions {
            text-align: center;
            padding: 30px 20px;
            color: #6c757d;
        }

        .no-questions-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7em;
            color: #6c757d;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-item.errors {
            color: #dc3545;
        }

        .stat-item.errors .stat-value {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Visualizador de Trivia</h1>
            <p>Selecciona un archivo JSON para visualizar las preguntas</p>
        </div>

        <div class="file-input-container">
            <div class="file-input-row">
                <div class="file-input-wrapper">
                    <input type="file" id="jsonFile" accept=".json" />
                </div>
                <button class="export-button" id="exportButton" disabled>
                    📥 Exportar Errores (0)
                </button>
            </div>
            <div class="file-input-row">
                <span class="image-path-label">Ruta base de imágenes:</span>
                <input type="text" id="imageBasePath" class="image-path-input" 
                       value=""
                       placeholder="Ej: ../../trivia/V03/www/packs/img/ o ruta completa desde el HTML" />
                <button type="button" id="helpButton" style="padding: 4px 8px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;" title="Ayuda">?</button>
            </div>
        </div>

        <div class="questions-container" id="questionsContainer">
            <div class="no-questions">
                <div class="no-questions-icon">📄</div>
                <h2>No hay preguntas cargadas</h2>
                <p>Selecciona un archivo JSON para comenzar</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('jsonFile');
        const questionsContainer = document.getElementById('questionsContainer');
        const exportButton = document.getElementById('exportButton');
        const imageBasePathInput = document.getElementById('imageBasePath');
        const helpButton = document.getElementById('helpButton');
        let currentQuestions = [];
        let errorQuestions = new Set();
        let currentFileName = '';
        let imageBasePath = ''; // Se puede especificar manualmente

        helpButton.addEventListener('click', function() {
            alert('AYUDA - Ruta de imágenes:\n\n' +
                  'El JSON tiene rutas como "../img/archivo.webp"\n' +
                  'Necesitas especificar la ruta desde donde está el HTML hasta la carpeta img.\n\n' +
                  'Ejemplos:\n' +
                  '- Si HTML e img están en la misma carpeta: "img/"\n' +
                  '- Si img está en carpeta padre: "../img/"\n' +
                  '- Si están en proyectos diferentes: "../../trivia/V03/www/packs/img/"\n\n' +
                  'Nota: Usa un servidor local (Live Server) para que las rutas funcionen correctamente.');
        });

        imageBasePathInput.addEventListener('input', function() {
            imageBasePath = this.value.trim();
            if (currentQuestions.length > 0) {
                displayQuestions(currentQuestions);
            }
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentFileName = file.name;
            imageBasePath = imageBasePathInput.value.trim();

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    currentQuestions = data;
                    errorQuestions.clear();
                    displayQuestions(data);
                } catch (error) {
                    alert('Error al leer el archivo JSON: ' + error.message);
                }
            };
            reader.readAsText(file);
        });

        exportButton.addEventListener('click', function() {
            exportErrors();
        });

        function toggleError(questionIndex) {
            if (errorQuestions.has(questionIndex)) {
                errorQuestions.delete(questionIndex);
            } else {
                errorQuestions.add(questionIndex);
            }
            updateErrorCount();
            updateQuestionCard(questionIndex);
        }

        // Hacer toggleError disponible globalmente para los event listeners inline
        window.toggleError = toggleError;

        // Función para intentar diferentes rutas de imagen si falla la primera
        function tryAlternativeImagePaths(imgElement, originalPath) {
            if (!originalPath) {
                imgElement.parentElement.innerHTML = '<span>Sin imagen</span>';
                return;
            }

            // Si ya intentamos todas las rutas, mostrar mensaje
            if (imgElement.dataset.failed === 'true') {
                return;
            }

            const basePaths = [
                '../img/',
                'img/',
                '../output/img/',
                '../',
                '',
                'www/packs/img/',
                'www/dlc/es/'
            ];

            let currentAttempt = parseInt(imgElement.dataset.attempt || '0');
            
            if (currentAttempt < basePaths.length) {
                const base = basePaths[currentAttempt];
                let newPath;
                
                if (originalPath.startsWith('../')) {
                    const cleanPath = originalPath.replace(/^\.\.\//, '');
                    if (base === '../') {
                        newPath = originalPath;
                    } else if (base === '') {
                        newPath = cleanPath;
                    } else {
                        newPath = base + cleanPath;
                    }
                } else {
                    newPath = base ? (base + originalPath.replace(/^\.\//, '')) : originalPath;
                }

                imgElement.dataset.attempt = (currentAttempt + 1).toString();
                
                // Si es el último intento, marcar como fallido
                if (currentAttempt + 1 >= basePaths.length) {
                    imgElement.onerror = function() {
                        this.parentElement.innerHTML = '<span>Imagen no encontrada</span>';
                        this.dataset.failed = 'true';
                    };
                }
                
                imgElement.src = newPath;
            } else {
                imgElement.parentElement.innerHTML = '<span>Imagen no encontrada</span>';
                imgElement.dataset.failed = 'true';
            }
        }

        window.tryAlternativeImagePaths = tryAlternativeImagePaths;

        function updateErrorCount() {
            const count = errorQuestions.size;
            exportButton.textContent = `📥 Exportar Errores (${count})`;
            exportButton.disabled = count === 0;
            
            // Actualizar estadística de errores
            const errorStat = document.querySelector('.stat-item.errors .stat-value');
            if (errorStat) {
                errorStat.textContent = count;
            }
        }

        function updateQuestionCard(questionIndex) {
            const card = document.querySelector(`[data-question-index="${questionIndex}"]`);
            const checkbox = document.querySelector(`[data-question-index="${questionIndex}"] .error-checkbox`);
            if (card && checkbox) {
                if (errorQuestions.has(questionIndex)) {
                    card.classList.add('has-error');
                    checkbox.checked = true;
                } else {
                    card.classList.remove('has-error');
                    checkbox.checked = false;
                }
            }
        }

        function exportErrors() {
            if (errorQuestions.size === 0) {
                alert('No hay preguntas marcadas con errores');
                return;
            }

            const errorList = Array.from(errorQuestions).sort((a, b) => a - b);
            let txtContent = `REPORTE DE ERRORES - CONTROL DE CALIDAD\n`;
            txtContent += `Fecha: ${new Date().toLocaleString('es-ES')}\n`;
            txtContent += `Archivo JSON: ${currentFileName || 'No especificado'}\n`;
            txtContent += `Total de preguntas con errores: ${errorList.length}\n`;
            txtContent += `Total de preguntas revisadas: ${currentQuestions.length}\n`;
            txtContent += `\n${'='.repeat(80)}\n\n`;

            errorList.forEach((index, listIndex) => {
                const question = currentQuestions[index];
                const hasImage = question.img && question.img.trim() !== '';
                
                txtContent += `ERROR #${listIndex + 1} - Pregunta #${index + 1}\n`;
                txtContent += `${'-'.repeat(80)}\n`;
                txtContent += `Pregunta: ${question.q || 'Sin pregunta'}\n`;
                txtContent += `Dificultad: ${question.difficulty || 'N/A'}\n`;
                txtContent += `Imagen: ${hasImage ? question.img : 'Sin imagen'}\n`;
                txtContent += `\nOpciones:\n`;
                
                (question.options || []).forEach((option, optIndex) => {
                    const isCorrect = optIndex === question.answer;
                    const marker = isCorrect ? '✓ CORRECTA' : '';
                    txtContent += `  ${optIndex + 1}. ${option} ${marker}\n`;
                });
                
                txtContent += `\n${'='.repeat(80)}\n\n`;
            });

            // Crear y descargar el archivo
            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `errores_trivia_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function displayQuestions(questions) {
            if (!Array.isArray(questions) || questions.length === 0) {
                questionsContainer.innerHTML = `
                    <div class="no-questions">
                        <div class="no-questions-icon">⚠️</div>
                        <h2>No se encontraron preguntas</h2>
                        <p>El archivo JSON no contiene preguntas válidas</p>
                    </div>
                `;
                return;
            }

            // Calcular estadísticas
            const stats = {
                total: questions.length,
                easy: questions.filter(q => q.difficulty === 'easy').length,
                medium: questions.filter(q => q.difficulty === 'medium').length,
                hard: questions.filter(q => q.difficulty === 'hard').length
            };

            let html = `
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Total</span>
                        <span class="stat-value">${stats.total}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Fácil</span>
                        <span class="stat-value">${stats.easy}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Medio</span>
                        <span class="stat-value">${stats.medium}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Difícil</span>
                        <span class="stat-value">${stats.hard}</span>
                    </div>
                    <div class="stat-item errors">
                        <span class="stat-label">Errores</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>
            `;

            questions.forEach((question, index) => {
                const hasImage = question.img && question.img.trim() !== '';
                const imagePath = hasImage ? question.img : '';
                
                let imageSrc = '';
                if (hasImage) {
                    // Si es URL absoluta, usarla directamente
                    if (imagePath.startsWith('http://') || imagePath.startsWith('https://')) {
                        imageSrc = imagePath;
                    } 
                    // Si empieza con /, es ruta absoluta desde la raíz
                    else if (imagePath.startsWith('/')) {
                        imageSrc = imagePath;
                    }
                    // Procesar la ruta: los JSONs tienen ../img/ pero desde el HTML solo necesitamos img/
                    else {
                        const base = imageBasePath.endsWith('/') ? imageBasePath : imageBasePath + '/';
                        let cleanPath = imagePath;
                        
                        // Remover ../img/ del inicio (los JSONs están en subcarpetas y usan ../img/)
                        if (cleanPath.startsWith('../img/')) {
                            cleanPath = cleanPath.replace(/^\.\.\/img\//, '');
                        }
                        // Remover ../ del inicio
                        else if (cleanPath.startsWith('../')) {
                            cleanPath = cleanPath.replace(/^\.\.\//, '');
                        }
                        // Remover ./ del inicio
                        else if (cleanPath.startsWith('./')) {
                            cleanPath = cleanPath.replace(/^\.\//, '');
                        }
                        
                        // Construir la ruta final: base + nombre del archivo
                        imageSrc = base + cleanPath;
                    }
                }

                const difficultyClass = `difficulty-${question.difficulty || 'easy'}`;
                const difficultyText = question.difficulty ? question.difficulty.charAt(0).toUpperCase() + question.difficulty.slice(1) : 'Easy';

                html += `
                    <div class="question-card" data-question-index="${index}">
                        <div class="error-checkbox-container">
                            <input type="checkbox" class="error-checkbox" 
                                   data-question-index="${index}"
                                   title="Marcar como error" />
                        </div>
                        <div class="question-image">
                            ${hasImage ? 
                                `<img src="${imageSrc}" alt="Imagen de pregunta" 
                                      onerror="tryAlternativeImagePaths(this, '${imagePath.replace(/'/g, "\\'")}')">` : 
                                '<span>Sin imagen</span>'
                            }
                        </div>
                        <div class="question-content">
                            <div class="question-row">
                                <div class="question-text">
                                    ${index + 1}. ${question.q || 'Sin pregunta'}
                                </div>
                                <span class="difficulty-badge ${difficultyClass}">${difficultyText}</span>
                            </div>
                            <div class="options-list">
                                ${(question.options || []).map((option, optIndex) => {
                                    const isCorrect = optIndex === question.answer;
                                    return `
                                        <div class="option ${isCorrect ? 'correct' : ''}">
                                            <span class="option-number">${optIndex + 1}</span>
                                            ${option}
                                            ${isCorrect ? ' ✓' : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            questionsContainer.innerHTML = html;
            updateErrorCount();
            
            // Agregar event listeners a los checkboxes después de crear el HTML
            document.querySelectorAll('.error-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const questionIndex = parseInt(this.dataset.questionIndex);
                    toggleError(questionIndex);
                });
            });
        }
    </script>
</body>
</html>
